[transports.local]
binary = "self"
run = ["{remote_argv...}"]

[transports.paired]
binary = "present"
run = ["{self}", "tunnel", "{name}"]

[transports.ssh]
binary = "upload"
run = [
  "ssh",
  "-T",
  "-o",
  "BatchMode=yes",
  "-o",
  "ServerAliveInterval=15",
  "-o",
  "ServerAliveCountMax=4",
  "-o",
  "ControlMaster=no",
  "-o",
  "ControlPath={cache}/s{session}-%C",
  "{host}",
  "{remote}",
]
share = [
  "ssh",
  "-T",
  "-o",
  "BatchMode=yes",
  "-o",
  "ServerAliveInterval=15",
  "-o",
  "ServerAliveCountMax=4",
  "-o",
  "ControlMaster=auto",
  "-o",
  "ControlPath={cache}/s{session}-%C",
  "-o",
  "ControlPersist=no",
  "{host}",
  "{remote}",
]
run_windows = [
  "ssh",
  "-T",
  "-o",
  "BatchMode=yes",
  "-o",
  "ServerAliveInterval=15",
  "-o",
  "ServerAliveCountMax=4",
  "{host}",
  "{remote}",
]

[sources.jj]
detect = ".jj"
priority = 20
separator = "nul"
resolve = [
  "jj",
  "--no-pager",
  "--color=never",
  "-R",
  "{root}",
  "log",
  "--no-graph",
  "-r",
  "{rev}",
  "-T",
  "commit_id",
]
list = [
  "jj",
  "--no-pager",
  "--color=never",
  "-R",
  "{root}",
  "file",
  "list",
  "-r",
  "{commit}",
  "-T",
  'executable ++ " " ++ file_type ++ "\t" ++ path ++ "\0"',
]
show = [
  "jj",
  "--no-pager",
  "--color=never",
  "-R",
  "{root}",
  "file",
  "show",
  "-r",
  "{commit}",
  "root-file:{path|fileset}",
]
identity = ["jj", "--no-pager", "--color=never", "-R", "{root}", "config", "path", "--repo"]

[sources.git]
detect = ".git"
priority = 10
separator = "nul"
resolve = ["git", "-C", "{root}", "rev-parse", "--verify", "--end-of-options", "{rev}^{{commit}}"]
list = ["git", "-C", "{root}", "ls-tree", "-r", "-z", "--full-tree", "{commit}"]
show = ["git", "-C", "{root}", "cat-file", "blob", "{commit}:{path}"]
identity = ["git", "-C", "{root}", "rev-parse", "--path-format=absolute", "--git-common-dir"]
unset = [
  "GIT_DIR",
  "GIT_WORK_TREE",
  "GIT_INDEX_FILE",
  "GIT_COMMON_DIR",
  "GIT_OBJECT_DIRECTORY",
  "GIT_NAMESPACE",
]

[runners.shell]
kind = "script"
run = "{input}"

[runners.exec]
kind = "argv"
run = ["{words...}"]

[notifiers.ntfy]
stdin = "text"
run = [
  "curl",
  "--proto",
  "=https",
  "-fsS",
  "-H",
  "Title: domyjob",
  "--data-binary",
  "@-",
  "--url",
  "https://ntfy.sh/{target}",
]

[notifiers.desktop]
stdin = "text"
run = ["sh", "-c", "notify-send -- domyjob \"$(cat)\""]
run_macos = [
  "sh",
  "-c",
  "osascript -e 'on run argv' -e 'display notification (item 1 of argv) with title \"domyjob\"' -e 'end run' -- \"$(cat)\"",
]

[distribution]
manifest = "https://github.com/P4suta/domyjob/releases/download/v{version}/domyjob-manifest.json"
latest = "https://github.com/P4suta/domyjob/releases/latest/download/domyjob-manifest.json"
archive = "https://github.com/P4suta/domyjob/releases/download/v{version}/domyjob-{target}.tar.gz"
fetch = [
  "curl",
  "--proto",
  "=https",
  "--tlsv1.2",
  "-fsSL",
  "--connect-timeout",
  "30",
  "--speed-limit",
  "1024",
  "--speed-time",
  "60",
  "-o",
  "{output}",
  "{url}",
]
unpack = ["tar", "-xzf", "{archive}", "-C", "{dir}"]
binary = "domyjob-{target}/domyjob{exe}"

[services.linux]
file = "{home}/.config/systemd/user/domyjob.service"
contents = '''[Unit]
Description=domyjob serve
After=network-online.target

[Service]
ExecStart="{exe}" serve {arguments}
Restart=on-failure
KillMode=process

[Install]
WantedBy=default.target
'''
install = [
  { run = [
    "systemctl",
    "--user",
    "daemon-reload",
  ], tolerate_failure = false },
  { run = [
    "systemctl",
    "--user",
    "enable",
    "--now",
    "domyjob.service",
  ], tolerate_failure = false },
]
uninstall = [
  { run = [
    "systemctl",
    "--user",
    "disable",
    "--now",
    "domyjob.service",
  ], tolerate_failure = false },
]
installed = "systemd user unit {home}/.config/systemd/user/domyjob.service; `loginctl enable-linger` keeps it running without a login"

[services.macos]
file = "{home}/Library/LaunchAgents/dev.domyjob.serve.plist"
contents = '''<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
<key>Label</key><string>dev.domyjob.serve</string>
<key>ProgramArguments</key><array><string>{exe_xml}</string><string>serve</string>{plist_arguments}</array>
<key>RunAtLoad</key><true/>
<key>KeepAlive</key><true/>
<key>StandardOutPath</key><string>{log_xml}</string>
<key>StandardErrorPath</key><string>{log_xml}</string>
</dict></plist>
'''
install = [
  { run = [
    "launchctl",
    "bootout",
    "gui/{uid}",
    "{home}/Library/LaunchAgents/dev.domyjob.serve.plist",
  ], tolerate_failure = true, note = "no earlier agent was loaded" },
  { run = [
    "launchctl",
    "bootstrap",
    "gui/{uid}",
    "{home}/Library/LaunchAgents/dev.domyjob.serve.plist",
  ], tolerate_failure = false },
]
uninstall = [
  { run = [
    "launchctl",
    "bootout",
    "gui/{uid}",
    "{home}/Library/LaunchAgents/dev.domyjob.serve.plist",
  ], tolerate_failure = false },
]
installed = "launch agent {home}/Library/LaunchAgents/dev.domyjob.serve.plist, logging to {log}"

[services.windows]
probe = ["schtasks", "/Query", "/TN", "domyjob-serve"]
install = [
  { run = [
    "schtasks",
    "/Create",
    "/F",
    "/SC",
    "ONLOGON",
    "/RL",
    "LIMITED",
    "/TN",
    "domyjob-serve",
    "/TR",
    "{action}",
  ], tolerate_failure = false },
  { run = [
    "powershell",
    "-NoProfile",
    "-NonInteractive",
    "-Command",
    "$s = New-ScheduledTaskSettingsSet -ExecutionTimeLimit ([TimeSpan]::Zero) -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable; Set-ScheduledTask -TaskName domyjob-serve -Settings $s | Out-Null",
  ], tolerate_failure = true, note = "the task may stop after 72 hours or on battery, because relaxing its limits failed" },
  { run = [
    "schtasks",
    "/Run",
    "/TN",
    "domyjob-serve",
  ], tolerate_failure = false },
]
uninstall = [
  { run = [
    "schtasks",
    "/End",
    "/TN",
    "domyjob-serve",
  ], tolerate_failure = true, note = "the task was not running" },
  { run = [
    "schtasks",
    "/Delete",
    "/F",
    "/TN",
    "domyjob-serve",
  ], tolerate_failure = false },
]
installed = "scheduled task domyjob-serve; Windows Defender Firewall will ask before the port is reachable"
