[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/P4suta/domyjob"
homepage = "https://github.com/P4suta/domyjob"
authors = ["domyjob contributors"]
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"
non_ascii_idents = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(kani)"] }

unused = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
unit_bindings = "deny"
variant_size_differences = "deny"
ambiguous_negative_literals = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
lossy_float_literal = "deny"
rc_buffer = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
mem_forget = "deny"
arithmetic_side_effects = "deny"
cognitive_complexity = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
try_err = "deny"
unused_result_ok = "deny"
create_dir = "deny"
error_impl_error = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
rc_mutex = "deny"
string_add = "deny"
assertions_on_result_states = "deny"
exit = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
wildcard_enum_match_arm = "deny"
fallible_impl_from = "deny"
shadow_unrelated = "deny"
undocumented_unsafe_blocks = "allow"

module_name_repetitions = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
manual_unwrap_or = "allow"
manual_unwrap_or_default = "allow"
manual_ok_err = "allow"
single_match_else = "allow"
manual_let_else = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
ctrlc = { version = "3.5", features = ["termination"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
schemars = "1"
semver = "1"
strsim = "0.11"
strum = { version = "0.28", features = ["derive"] }
tar = { version = "0.4", default-features = false }
uds_windows = "1.2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
fs4 = { version = "1", default-features = false, features = ["sync"] }
cap-std = "4"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
anstream = "1"
anstyle = "1"
bytesize = "2"
comfy-table = { version = "8", default-features = false, features = ["custom_styling"] }
indicatif = "0.18"
supports-unicode = "3"
terminal_size = "0.4"
unicode-width = "0.2"
vte = "0.15"
clap_mangen = "0.3"
fail = "0.5"
data-encoding = "2.11"
data-encoding-macro = "0.1"
shlex = "2"
socket2 = "0.6"
blake2 = "0.11"
blake3 = { version = "1.8", features = ["mmap"] }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
ed25519-dalek = "3"
getrandom = "0.3"
ignore = "0.4"
if-addrs = "0.15"
mdns-sd = "0.21"
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "zeroize"] }
ml-kem = { version = "0.3", features = ["hazmat", "zeroize"] }
minisign-verify = "0.2"
proptest = "1"
regex = { version = "1.11", default-features = false, features = [
  "std",
  "unicode-perl",
  "unicode-case",
] }
proc-macro2 = { version = "1.0", default-features = false, features = ["span-locations"] }
security-framework = "3.7"
rustix = { version = "1.1", features = ["event", "pipe", "process", "system"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
snow = "0.10"
spake2 = "0.4"
syn = { version = "3", default-features = false, features = [
  "full",
  "parsing",
  "visit",
  "extra-traits",
  "clone-impls",
] }
tempfile = "3"
thiserror = "2"
toml = "1.1"
toml_edit = "0.25"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1.8"
windows-spawn = "0.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Networking_WinSock",
  "Win32_System_Pipes",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
