[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/P4suta/domyjob"
homepage = "https://github.com/P4suta/domyjob"
authors = ["domyjob contributors"]
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"
non_ascii_idents = "deny"
unexpected_cfgs = "deny"

unused = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
unit_bindings = "deny"
variant_size_differences = "deny"
ambiguous_negative_literals = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
lossy_float_literal = "deny"
rc_buffer = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
mem_forget = "deny"
arithmetic_side_effects = "deny"
cognitive_complexity = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
try_err = "deny"
unused_result_ok = "deny"
create_dir = "deny"
error_impl_error = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
rc_mutex = "deny"
string_add = "deny"
assertions_on_result_states = "deny"
exit = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
wildcard_enum_match_arm = "deny"
fallible_impl_from = "deny"
shadow_unrelated = "deny"
undocumented_unsafe_blocks = "allow"

redundant_pub_crate = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
manual_unwrap_or = "allow"
manual_unwrap_or_default = "allow"
manual_ok_err = "allow"
single_match_else = "allow"
manual_let_else = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
tar = { version = "0.4", default-features = false }
cap-std = "4"
data-encoding = "2.11"
blake3 = { version = "1.8", default-features = false }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
getrandom = "0.3"
ignore = "0.4"
proc-macro2 = { version = "1.0", default-features = false, features = ["span-locations"] }
rustix = { version = "1.1", features = ["event", "pipe", "process", "system"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redb = "4.3.0"
schemars = "1"
syn = { version = "3", default-features = false, features = [
  "full",
  "parsing",
  "visit",
  "extra-traits",
  "clone-impls",
] }
tempfile = "3"
thiserror = "2"
windows-spawn = "0.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

[profile.test]
debug = 0

[profile.remote]
inherits = "dev"
debug = 0
incremental = true
opt-level = 1
strip = true

[profile.release]
strip = true
lto = true
codegen-units = 1
