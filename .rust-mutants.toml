# Mutants the tests cannot notice because they change nothing observable or can never run.
# Every other surviving mutant is a gap in the tests to close, not to record here.

[[mutation.expect]]
path = "crates/domyjob-core/src/chat/exchange.rs"
item = "Outgoing::offer"
rule = "false-to-true"
original = "false"
line = 42
reason = "a full batch refuses the event either way; answering true only lets the caller offer the remaining events, which are refused too, so the batch and its more flag are the same"
outcome = "survived"

[[mutation.expect]]
path = "crates/domyjob-core/src/chat/model.rs"
item = "<Model as Outbox>::outgoing"
rule = "break-to-continue"
original = "break"
line = 212
reason = "once the batch is full every further offer is refused, so continuing leaves the batch and its more flag unchanged"
outcome = "survived"

