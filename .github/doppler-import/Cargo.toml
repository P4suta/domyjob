[package]
name = "doppler-transfer-domyjob"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[[bin]]
name = "doppler-transfer"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"

[lints.rust]
unsafe_code = "forbid"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
all = "warn"
