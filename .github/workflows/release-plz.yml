name: release-plz

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.repository == 'P4suta/domyjob'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
