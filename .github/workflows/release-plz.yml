name: release-plz

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: cut the tag
    if: github.repository == 'P4suta/domyjob' && vars.RELEASE_PLZ_APP_CLIENT_ID != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: release-plz
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Fetch automation credentials
        id: doppler_automation_0
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: domyjob
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_0.outcome == 'success' && (
          steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: rust
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-pr:
    name: keep the release pull request
    needs: release
    if: always() && github.repository == 'P4suta/domyjob' && vars.RELEASE_PLZ_APP_CLIENT_ID != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: release-plz
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Fetch automation credentials
        id: doppler_automation_0
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: domyjob
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_0.outcome == 'success' && (
          steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: rust
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
