name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: rust
      - name: Read and validate the workspace version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps --locked | jq --raw-output '.packages[] | select(.name == "domyjob") | .version')"
          if [ "$EVENT_NAME" = "push" ] && [ "v${version}" != "${TAG}" ]; then
            echo "the tag ${TAG} does not name version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: [check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: rust
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          cargo build --locked --release --package domyjob --target "$TARGET"
      - name: Sign and notarize the macOS binary
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/domyjob"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          codesign --force --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$APPLE_NOTARY_KEY" > "$key"
          ditto -c -k --keepParent "$binary" "$RUNNER_TEMP/domyjob.zip"
          result="$(xcrun notarytool submit "$RUNNER_TEMP/domyjob.zip" --key "$key" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait --output-format json)"
          if [ "$(jq --raw-output .status <<<"$result")" != "Accepted" ]; then
            xcrun notarytool log "$(jq --raw-output .id <<<"$result")" --key "$key" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID"
            exit 1
          fi
          security delete-keychain "$keychain"
      - name: Sign the Windows binary
        if: runner.os == 'Windows'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.SSLDOTCOM_USERNAME }}
          password: ${{ secrets.SSLDOTCOM_PASSWORD }}
          credential_id: ${{ secrets.SSLDOTCOM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSLDOTCOM_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/target/${{ matrix.target }}/release/domyjob.exe
          override: true
          environment_name: PROD
      - name: Verify the Windows signature and timestamp
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $binary = "target/$env:TARGET/release/domyjob.exe"
          $signature = Get-AuthenticodeSignature -FilePath $binary
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or $null -eq $signature.TimeStamperCertificate) {
            throw "The binary needs a valid Authenticode signature and timestamp: $($signature.Status)"
          }
      - name: Bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          name="domyjob-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          if [ -f "target/${TARGET}/release/domyjob.exe" ]; then
            cp "target/${TARGET}/release/domyjob.exe" "dist/${name}/"
          else
            cp "target/${TARGET}/release/domyjob" "dist/${name}/"
          fi
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/${name}/"
          (cd dist && tar --create --gzip --file "${name}.tar.gz" "${name}")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: verify and publish
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Generate and verify checksums
        run: |
          set -euo pipefail
          cd dist
          archives=( *.tar.gz )
          if [ "${#archives[@]}" -ne 5 ]; then
            echo "expected five release archives, got ${#archives[@]}" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            sha256sum "$archive" > "$archive.sha256"
          done
          sha256sum --check -- *.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Preserve the verified archives
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-verified
          path: dist/*
          if-no-files-found: error
      - name: Publish the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag dist/*
