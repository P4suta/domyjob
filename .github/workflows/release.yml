name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: rust aqua:EmbarkStudios/cargo-deny aqua:rustsec/rustsec/cargo-audit cargo:cargo-vet
      - name: Read and validate the workspace version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          SOURCE_REF: ${{ github.ref }}
        run: cargo xtask release version
      - name: Verify the tag policy using the workflow token before signing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo xtask release queue policy
      - name: Check dependency licenses, bans, and sources
        run: cargo xtask dependencies deny
      - name: Check dependencies against the current RustSec advisory database
        run: cargo xtask dependencies audit
      - name: Verify dependency audit evidence
        run: cargo xtask dependencies vet

  build:
    name: build (${{ matrix.target }})
    needs: [check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: rust
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo xtask release build
      - name: Sign the macOS binary and installer, then submit the package for notarization
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check.outputs.version }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: cargo xtask release sign-macos
      - name: Sign the Windows binary
        if: runner.os == 'Windows'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          signing_method: v2
          username: ${{ secrets.SSLDOTCOM_USERNAME }}
          password: ${{ secrets.SSLDOTCOM_PASSWORD }}
          credential_id: ${{ secrets.SSLDOTCOM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSLDOTCOM_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/target/${{ matrix.target }}/release/domyjob.exe
          override: true
          environment_name: PROD
      - name: Verify the Windows signature, expected publisher, and timestamp
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          WINDOWS_SIGNING_IDENTITY_SHA256: ${{ vars.WINDOWS_SIGNING_IDENTITY_SHA256 }}
        run: cargo xtask release verify-windows
      - name: Bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check.outputs.version }}
          WINDOWS_SIGNING_IDENTITY_SHA256: ${{ vars.WINDOWS_SIGNING_IDENTITY_SHA256 }}
        run: cargo xtask release bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('dist/*.tar.gz', 'dist/*.pkg') != ''
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.pkg
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && runner.os == 'macOS' && hashFiles('notarization/*.json') != ''
        with:
          name: notary-${{ matrix.target }}
          path: notarization/*.json
          if-no-files-found: error

  handoff:
    name: preserve pending distribution
    needs: [check, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: rust
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Generate and verify checksums
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: cargo xtask release checksums
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: notary-*
          merge-multiple: true
          path: dist/notarization
      - name: Bind pending submissions to the original distribution
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: cargo xtask release queue handoff
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.pkg
            dist/manifest.json
      - name: Preserve the pending archives and receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-pending
          path: dist/*
          if-no-files-found: error
          retention-days: 14
