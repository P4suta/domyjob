
name: Dependency review

on:
  pull_request:
    branches: [main]

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  review:
    name: Review dependencies
    needs: [changes]
    if: needs.changes.outputs.dependency_review == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review the change
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          show-openssf-scorecard: true
          comment-summary-in-pr: on-failure

  dependency-review:
    name: Dependency review
    if: always()
    needs: [changes, review]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: domyjob-ci-v1
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Require the selected dependency review
        env:
          PLAN_JSON: ${{ needs.changes.outputs.plan }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: cargo xtask ci gate dependency-review
