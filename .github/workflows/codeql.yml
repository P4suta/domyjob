
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 3 * * 2"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  analyze:
    needs: [changes]
    if: needs.changes.outputs.codeql_rust == 'true' || needs.changes.outputs.codeql_actions == 'true'
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Scan
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  required:
    name: CodeQL required
    if: always()
    needs: [changes, analyze]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: domyjob-ci-v2
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify scan
        env:
          PLAN_JSON: ${{ needs.changes.outputs.plan }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: cargo xtask ci gate codeql
