name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: "false"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  lint:
    needs: [changes]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: ${{ (needs.changes.outputs.product == 'true' || needs.changes.outputs.xtask == 'true') && 'rust actionlint taplo typos npm:jscpd' || needs.changes.outputs.workflows == 'true' && 'rust actionlint typos' || 'rust typos' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: domyjob-ci-v2
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask ci check
        env:
          PLAN_JSON: ${{ needs.changes.outputs.plan }}

  deny:
    needs: [changes]
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: rust aqua:EmbarkStudios/cargo-deny aqua:rustsec/rustsec/cargo-audit
      - run: mise run deny
      - run: mise run audit

  vet:
    needs: [changes]
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: rust cargo:cargo-vet
      - run: mise run vet

  test:
    needs: [changes]
    if: needs.changes.outputs.product == 'true' || needs.changes.outputs.xtask == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: ${{ needs.changes.outputs.product == 'true' && 'rust actionlint aqua:nextest-rs/nextest/cargo-nextest' || 'rust actionlint' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: domyjob-ci-v2
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask ci test
        env:
          PLAN_JSON: ${{ needs.changes.outputs.plan }}

  fuzz:
    needs: [changes]
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: rust
      - run: rustup toolchain install nightly-2026-10-01 --component rust-src
      - run: cargo install --locked cargo-fuzz --version 0.13.2
      - run: mise run fuzz

  ci-success:
    name: ci-success
    if: always()
    needs: [changes, lint, deny, vet, test, fuzz]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: domyjob-ci-v2
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Require every selected gating job
        env:
          PLAN_JSON: ${{ needs.changes.outputs.plan }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: cargo xtask ci gate ci

  required:
    name: required
    if: always()
    needs: [ci-success]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the complete CI gate
        env:
          CI_RESULT: ${{ needs.ci-success.result }}
        run: test "$CI_RESULT" = success
