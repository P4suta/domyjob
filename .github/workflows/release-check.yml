name: Release check

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate commit, tag, or branch to verify without publishing
        required: true
        type: string
  workflow_call:
    inputs:
      candidate_ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-check-${{ inputs.candidate_ref }}
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: "false"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false
      - name: Resolve the candidate once for every verification job
        id: source
        run: echo "sha=$(git rev-parse --verify 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

  proofs:
    needs: candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.7
          install_args: rust node java npm:@informalsystems/quint cargo:kani-verifier@0.68.0 cargo:cargo-fuzz@0.13.2 aqua:nextest-rs/nextest/cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-proofs
          cache-bin: false
      - run: mise x cargo:kani-verifier@0.68.0 -- cargo kani setup
      - run: rustup toolchain install nightly-2026-10-01 --component miri --component rust-src
      - name: Check every proof, named negative, model trace, and preserved corpus
        run: mise run verify
      - name: Interpret every finite Miri lane
        run: mise run miri

  fuzz:
    needs: candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.7
          install_args: rust cargo:cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: release-fuzz
          cache-bin: false
      - run: rustup toolchain install nightly-2026-10-01 --component rust-src
      - name: Explore every fuzz target with 20000 runs and seed one
        run: mise run fuzz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: release-fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: native (${{ matrix.os }})
    needs: candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.7
          install_args: rust actionlint aqua:nextest-rs/nextest/cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-native
          cache-bin: false
      - run: mise run clippy
      - run: mise run gates
      - run: mise run verify:inventory
      - name: Check the actual Windows SDK contracts
        if: runner.os == 'Windows'
        run: cargo xtask windows-contracts
      - run: mise run test
      - name: Prepare the Linux user manager for isolated resource contracts
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
      - name: Check native Linux resource ownership
        if: runner.os == 'Linux'
        run: mise run resource-contracts
      - name: Repeat reply-wait scenarios ten times on Windows
        if: runner.os == 'Windows'
        run: >-
          cargo nextest run --locked -p domyjob --test e2e
          --stress-count 10 --fail-fast --no-tests=fail
          -E 'test(=mcp_serves_an_interactive_agent) | test(=bootstrap_preserves_first_request_and_cleans_its_owned_work) | test(=jobs_run_through_the_node_wrapper)'
