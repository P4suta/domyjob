test = false
doc = false
bench = false

[[bin]]
name = "state"
path = "fuzz_targets/state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook_clients"
path = "fuzz_targets/hook_clients.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chat_ledger"
path = "fuzz_targets/chat_ledger.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_paths"
path = "fuzz_targets/source_paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "process_group"
path = "fuzz_targets/process_group.rs"
test = false
doc = false
bench = false
