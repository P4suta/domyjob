[package]
name = "domyjob-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
domyjob-core = { path = "../crates/domyjob-core" }
libfuzzer-sys = "0.4"
serde_json = "1"

[workspace]

[[bin]]
name = "terminal_input"
path = "fuzz_targets/terminal_input.rs"
