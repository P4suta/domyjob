[package]
name = "domyjob-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
domyjob-core = { path = "../crates/domyjob-core" }
libfuzzer-sys = "0.4"
serde_json = "1"

[workspace]

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state"
path = "fuzz_targets/state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_paths"
path = "fuzz_targets/source_paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "process_group"
path = "fuzz_targets/process_group.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_marker"
path = "fuzz_targets/cache_marker.rs"
test = false
doc = false
bench = false

[[bin]]
name = "process_inventory"
path = "fuzz_targets/process_inventory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_cleanup"
path = "fuzz_targets/client_cleanup.rs"
test = false
doc = false
bench = false
