notes = """
Automated delta source review from the existing Bytecode Alliance safe-to-deploy path ending at 0.8.9.
Reviewed every changed packaged file and all complete Rust implementation differences.
The crate retains forbid(unsafe_code) and introduces no OS, network, or process authority.
Reviewed prefix-code space checks that reject over-subscribed Huffman tables, incomplete multi-bit codes, the saturating output-byte limit capped to the slice, and the existing bounded fallback copy path.
The changed absolute-end versus bytes-left comparison can select the slower copy path; that path still caps writes to the remaining output space.
Verified all 512 entries of the old small-distance extra-bit table against the reduced 128-entry table indexed by distance >> 2.
Reviewed new owned-buffer Clone implementations, bounded compression parameters, partial and optional flush markers, Finish/trailer handling, stored-block changes, boxed Wasm buffers, and explicit alloc/no_std serde features.
Post-start compression parameter changes remain unsupported, and this audit does not claim every optional window/level combination is correct or universally panic-free.
The distinct RAW/RLE flag conjunction in window_bits_from_flags does not recognize those flags; the remaining branches still bound its result, and no selected decompression-path issue was found.
Callers must enforce archive input and decompressed-output limits independently.
This is an automated delta audit, not a new full review of the imported baseline or a human audit.
