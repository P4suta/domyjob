[[audits.crc32fast]]
who = "Codex (automated source review)"
criteria = "safe-to-deploy"
delta = "1.4.2 -> 1.5.0"
notes = """
Automated delta source review from the existing Google safe-to-deploy audit of 1.4.2.
Reviewed every changed packaged file, normalized and original manifests, the new build script, and all complete Rust implementation differences.
The substantive algorithm change replaces GF(2) matrix combination with a bounded 32-bit polynomial multiply and a 32-entry exponent table; indexing is capped and at most 64 length bits are processed.
An independent comparison against the trusted baseline combination algorithm passed 19,584 cases, including zero length, every power-of-two boundary, arbitrary CRC states, and large u64 lengths.
Stable ARM CRC dispatch is enabled only on compilers with the stabilized intrinsics; constructors still require CPU CRC support through runtime detection or the no_std compile-time target feature.
Reviewed the previously gated ARM implementation's aligned integer slices, exact eight-element chunk indexing, remainder handling, and CRC instruction selection; 59,392 native aarch64 cases passed against an independent bitwise CRC oracle across initial states, alignments, boundaries, resets, and streaming splits.
The x86 folding algorithm remains 128-bit and unchanged apart from qualified paths, documentation, and removal of inactive debug output; this version has no 128-to-256/512 SIMD casts.
The build script invokes the trusted RUSTC executable directly with --version and emits Cargo cfg metadata; compiler identity and output remain trusted build inputs, and the script has no internal timeout.
The edition and minimum compiler version increase, and package-only benchmarks, lockfile, CI, and tests change; the reconstruction-from-length property test loses its distinct reconstruction coverage.
The selected workspace graph disables default features, retains the Rust/miniz backend, and confines this dependency to xtask rather than the shipped product.
This audit does not approve 1.5.1 or 1.5.2, exercise x86 at runtime, prove every polynomial/input case, or newly fully review the imported baseline.
The review is automated and is not represented as a human audit.
Exact crate archive SHA256 values, independently matched to the official Cargo registry index: a97769d94ddab943e4510d138150169a2758b5ef3eb191a9ee688de3e23ef7b3 -> 9481c1c90cbf2ac953f07c8d4a58aa3945c425b7185c9154d67a65e4230da511.
Evidence: reports/dependencies/20261002-notarization-queue/crc32fast-1.5.0-candidate-source.json, baseline-trust-paths.json, crc32fast-independent-oracle.json, crc32fast-selected-review.json, and crc32fast-1.4.2-to-1.5.0.diff.txt.
"""

