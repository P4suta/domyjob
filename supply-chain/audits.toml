[[audits.flate2]]
who = "Codex (automated source review)"
criteria = "safe-to-deploy"
delta = "1.1.5 -> 1.1.10"
notes = """
Automated delta source review from the existing imported safe-to-deploy path ending at 1.1.5.
Reviewed every changed packaged file, manifests, the removed corrupt-gzip fixture, and all complete implementation differences.
The selected workspace Rust/miniz backend, with default features disabled, retains safe slices, consumption counters, reset semantics, and error propagation while mapping partial flush distinctly.
Reviewed the new safe zlib-rs adapter, optional backend selection, retired bindings, and std-to-core/alloc changes; optional backend dependency implementations remain separately audited if activated.
The inherited Google baseline explicitly excludes any_zlib coverage, so this delta does not claim a new full audit of the C backends or optional dependencies.
Gzip header/footer zero-progress writes now fail with WriteZero, truncated deflate input fails with UnexpectedEof, and gzip extra-field length is validated before u16 serialization.
Gzip and zlib resets preserve allocation while resetting backend/header/CRC state; unread-reader and output-order requirements are documented.
Runtime detection becomes an explicit default feature, and no package build script, production shell, network, or filesystem authority is introduced.
CRC32 remains a separately audited dependency; the workspace pins a reviewed version that avoids the later wide-SIMD cast finding.
Archive input, gzip headers, and decompressed output must be bounded by the caller; this review does not prove universal termination or all-feature/architecture behavior.
This is an automated delta audit, not a new full review of the imported baseline or a human audit.
