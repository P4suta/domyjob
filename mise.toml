[tools]
rust = { version = "1.98.0", components = ["clippy", "rustfmt"] }
actionlint = "1.7.12"
taplo = "0.10.0"
typos = "1.50.1"
lefthook = "2.1.9"
"aqua:EmbarkStudios/cargo-deny" = "0.19.7"
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"
"cargo:cargo-vet" = "0.10.2"
"aqua:crate-ci/committed" = "1.1.11"
"npm:jscpd" = "5.3.2"
"aqua:axodotdev/cargo-dist" = "0.33.0"

[settings]
cargo.binstall = false

[tasks.bootstrap]
description = "Fetch the locked dependencies and install the git hooks"
run = ["cargo fetch --locked", "lefthook install"]

[tasks.fmt]
description = "Format Rust and TOML"
run = ["cargo fmt --all", "taplo fmt"]
env = { RUST_LOG = "warn" }

[tasks."fmt:check"]
description = "Check Rust and TOML formatting"
run = ["cargo fmt --all -- --check", "taplo fmt --check", "taplo lint"]
env = { RUST_LOG = "warn" }

[tasks.clippy]
description = "Lint every target with warnings denied"
run = "cargo clippy --locked --workspace --all-targets -- -D warnings"

[tasks."clippy:targets"]
description = "Lint every target for Linux and Windows too, whatever the host"
# BLAKE3 then builds without a C compiler for the foreign target.
env = { CARGO_FEATURE_PURE = "1" }
run = [
  "rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-msvc",
  "cargo clippy --locked --workspace --all-targets --target x86_64-unknown-linux-gnu -- -D warnings",
  "cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings",
]

[tasks.gates]
description = "Enforce the pure core and platform effect boundaries"
run = "cargo xtask gates"

[tasks.lint]
description = "Check formatting, types, architecture, spelling, workflows, and duplication"
depends = ["fmt:check", "clippy", "clippy:targets", "gates"]
run = ["typos", "cargo xtask workflows", "jscpd --config .jscpd.json --silent"]

[tasks.test]
description = "Run the complete workspace test suite"
run = "cargo test --locked --workspace --all-targets"

[tasks.fuzz]
description = "Fuzz the wire ingress, job state transitions, and chat ledger convergence"
dir = "fuzz"
run = [
  "mkdir -p corpus/wire",
  "cp seeds/wire/* corpus/wire/",
  "cargo +nightly-2026-08-21 fuzz run wire -- -runs=20000 -seed=1 -verbosity=0",
  "cargo +nightly-2026-08-21 fuzz run state -- -runs=20000 -seed=1 -verbosity=0",
  "cargo +nightly-2026-08-21 fuzz run chat_ledger -- -runs=20000 -seed=1 -verbosity=0",
]

[tasks.deny]
description = "Check dependency licenses, bans, and sources"
run = "cargo xtask dependencies deny"

[tasks.audit]
description = "Check dependencies against the RustSec advisory database"
run = "cargo xtask dependencies audit"

[tasks.vet]
description = "Check pinned dependency audit evidence"
run = "cargo xtask dependencies vet"

[tasks.check]
description = "Run local lint, tests, and dependency checks"
run = ["mise run lint", "mise run test", "mise run deny", "mise run audit", "mise run vet"]

[tasks."check:linux"]
description = "Lint and test this checkout on Linux through domyjob"
run = "cargo run --quiet --locked -p domyjob -- run linux --wait -- /bin/bash -lc 'export MISE_TRUSTED_CONFIG_PATHS=\"$PWD\" CARGO_TARGET_DIR=\"$HOME/.cache/domyjob/check-target\" RUSTC_WRAPPER=; mise run clippy && mise run gates && mise run test'"

[tasks."check:win"]
description = "Lint and test this checkout on Windows through domyjob"
run = "cargo run --quiet --locked -p domyjob -- run win --wait -- powershell.exe -NoProfile -Command '$env:MISE_TRUSTED_CONFIG_PATHS=(Get-Location).Path; $env:CARGO_TARGET_DIR=Join-Path $env:LOCALAPPDATA \"domyjob/check-target\"; $env:RUSTC_WRAPPER=\"\"; mise run clippy; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; mise run gates; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; mise run test; exit $LASTEXITCODE'"

[tasks."check:fleet"]
description = "Run this checkout's checks on Linux and Windows"
run = ["mise run check:linux", "mise run check:win"]
