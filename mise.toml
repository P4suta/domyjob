[tools]
rust = { version = "1.99.0", components = ["clippy", "rustfmt"] }
"aqua:PowerShell/PowerShell" = { version = "7.6.6", os = ["windows"] }
actionlint = "1.7.12"
taplo = "0.10.0"
typos = "1.50.3"
lefthook = "2.1.15"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"
"cargo:cargo-vet" = "0.10.2"
"aqua:crate-ci/committed" = "1.1.11"
"npm:jscpd" = "5.4.0"
node = "26.11.1"
"npm:@informalsystems/quint" = "0.32.0"
java = "temurin-25.0.4+101.0.LTS"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"

[settings]
cargo.binstall = false

[tasks.bootstrap]
description = "Fetch the locked dependencies and install the git hooks"
run = ["cargo fetch --locked", "lefthook install"]

[tasks.fmt]
description = "Format Rust and TOML"
run = [
  "cargo fmt --all",
  "cargo fmt --manifest-path fuzz/Cargo.toml",
  "rustfmt --edition 2024 verification/resource-negative.rs verification/source-negative.rs verification/chat-negative.rs verification/outbound-proof.rs verification/source-metadata-directories.rs verification/input-controller.rs",
  "rustfmt --edition 2024 verification/login-reply.rs",
  "rustfmt --edition 2024 verification/worker-handoff.rs",
  "rustfmt --edition 2024 verification/proof-exit-policy.rs verification/trash-removal.rs",
  "taplo fmt",
]
env = { RUST_LOG = "warn" }

[tasks."fmt:check"]
description = "Check Rust and TOML formatting"
run = [
  "cargo fmt --all -- --check",
  "cargo fmt --manifest-path fuzz/Cargo.toml -- --check",
  "rustfmt --edition 2024 --check verification/resource-negative.rs verification/source-negative.rs verification/chat-negative.rs verification/outbound-proof.rs verification/source-metadata-directories.rs verification/input-controller.rs",
  "rustfmt --edition 2024 --check verification/login-reply.rs",
  "rustfmt --edition 2024 --check verification/worker-handoff.rs",
  "rustfmt --edition 2024 --check verification/proof-exit-policy.rs verification/trash-removal.rs",
  "taplo fmt --check",
  "taplo lint",
]
env = { RUST_LOG = "warn" }

[tasks.clippy]
description = "Lint every target with warnings denied"
run = "cargo clippy --locked --workspace --all-targets -- -D warnings"

[tasks."clippy:targets"]
description = "Lint every target for Linux and Windows too, whatever the host"
env = { CARGO_FEATURE_PURE = "1" }
run = [
  "rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-msvc",
  "cargo clippy --locked --workspace --all-targets --target x86_64-unknown-linux-gnu -- -D warnings",
  "cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings",
]

[tasks.gates]
description = "Enforce the pure core and platform effect boundaries"
run = "cargo xtask gates"

[tasks."windows-contracts"]
description = "Reject invalid Windows capabilities with the actual SDK types"
depends = ["clippy:targets"]
run = "cargo xtask windows-contracts"

[tasks.lint]
description = "Check formatting, types, architecture, spelling, workflows, and duplication"
depends = ["clippy", "clippy:targets", "windows-contracts", "fuzz:check"]
run = "mise run lint:static"

[tasks."lint:static"]
description = "Run the shared formatting, architecture, spelling, workflow, and duplication checks"
run = "cargo xtask ci static"

[tasks.test]
description = "Run the complete workspace test suite, each test in its own process"
run = "cargo nextest run --locked --workspace --all-targets --no-tests=fail"

[tasks."resource-proofs"]
description = "Verify every inventoried proof, negative control, and source-bound model replay"
run = "cargo xtask verify"

[tasks.verify]
description = "Verify the complete source-bound proof inventory and model traces"
run = "cargo xtask verify"

[tasks."verify:models"]
description = "Check protocol induction and replay 100 fixed-seed Quint traces"
run = "cargo xtask verify models"

[tasks."fuzz:replay"]
description = "Replay preserved production ingress corpora"
run = "cargo xtask verify fuzz"

[tasks.miri]
description = "Interpret finite production state, protocol, serialization, and source-ingress contracts"
run = [
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob-core --lib -E 'test(worker_handoff::tests)' --no-tests=fail --test-threads=1",
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob-core --lib -E 'test(state::tests)' --no-tests=fail --test-threads=1",
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob-core --test job_protocol --no-tests=fail --test-threads=1",
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob-core --test login_reply --no-tests=fail --test-threads=1",
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob-core --lib -E 'test(=wire::tests::frames_propagate_serializer_failures_without_panicking)' --no-tests=fail --test-threads=1",
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob-core --lib -E 'test(=source_paths::tests::tracked_records_are_exact_portable_paths)' --no-tests=fail --test-threads=1",
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob-core --lib -E 'test(=source_paths::tests::every_repository_metadata_component_is_excluded_at_any_depth)' --no-tests=fail --test-threads=1",
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob --bin domyjob -E 'test(transport::input::tests)' --no-tests=fail --test-threads=1",
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob-core --test process_group --no-tests=fail --test-threads=1",
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob --bin domyjob -E 'test(source::metadata_directories::tests)' --no-tests=fail --test-threads=1",
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob --test input_controller --no-tests=fail --test-threads=1",
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob-core --test notifications --no-tests=fail --test-threads=1",
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob-core --test hook_clients -E 'test(=codex_setup_preserves_foreign_hooks_and_replaces_only_its_own_groups) | test(=malformed_hook_documents_are_refused_without_replacing_the_user_document)' --no-tests=fail --test-threads=1",
  "cargo +nightly-2026-10-01 miri nextest run --locked -p domyjob-core --test capture_policy --no-tests=fail --test-threads=1",
]

[tasks."resource-contracts"]
description = "Check small memory-limited scopes on a native Linux user systemd manager"
run = "cargo nextest run --locked -p domyjob --bin domyjob --run-ignored only -E 'test(native_resource_)' --no-tests=fail --test-threads 1"

[tasks."fuzz:check"]
description = "Type-check every fuzz target against the current core API"
run = "cargo check --locked --manifest-path fuzz/Cargo.toml --bins"

[tasks.fuzz]
description = "Fuzz wire and source ingress, job state transitions, and chat ledger convergence"
depends = ["fuzz:check"]
dir = "fuzz"
run = [
  "mkdir -p corpus/wire",
  "cp seeds/wire/* corpus/wire/",
  "cargo +nightly-2026-10-01 fuzz run wire -- -runs=20000 -seed=1 -verbosity=0",
  "cargo +nightly-2026-10-01 fuzz run state -- -runs=20000 -seed=1 -verbosity=0",
  "cargo +nightly-2026-10-01 fuzz run chat_ledger -- -runs=20000 -seed=1 -verbosity=0",
  "cargo +nightly-2026-10-01 fuzz run source_paths corpus/source_paths -- -runs=20000 -seed=1 -verbosity=0",
  "cargo +nightly-2026-10-01 fuzz run process_group corpus/process_group -- -runs=20000 -seed=1 -verbosity=0",
  "cargo +nightly-2026-10-01 fuzz run hook_clients corpus/hook_clients -- -runs=20000 -seed=1 -verbosity=0",
]

[tasks.mutants]
description = "Measure mutations in the core and repository gates"
run = '"${DOMYJOB_MUTATION_TOOL:-rust-mutants}" run --package domyjob-core --package xtask --jobs auto --locked --trace'

[tasks."mutants:source"]
description = "Measure ordinary binary tests with isolated source mutations"
run = '"${DOMYJOB_MUTATION_TOOL:-rust-mutants}" run --config .rust-mutants-source.toml --package domyjob --execution-mode source --jobs auto --locked --trace'

[tasks.deny]
description = "Check dependency licenses, bans, and sources"
run = "cargo xtask dependencies deny"

[tasks.audit]
description = "Check dependencies against the RustSec advisory database"
run = "cargo xtask dependencies audit"

[tasks.vet]
description = "Check pinned dependency audit evidence"
run = "cargo xtask dependencies vet"

[tasks.check]
description = "Run local lint, tests, and dependency checks"
run = [
  "mise run lint",
  "mise run test",
  "cargo xtask resource-contracts",
  "mise run deny",
  "mise run audit",
  "mise run vet",
]

[tasks."check:scope"]
description = "Validate the exact push ranges with the shared CI scope policy"
run = "cargo xtask ci hook"

[tasks."check:linux"]
description = "Lint and test this checkout on Linux through domyjob"
run = "cargo run --quiet --locked -p domyjob -- run linux --wait -- /bin/bash -lc 'export MISE_TRUSTED_CONFIG_PATHS=\"$PWD\" CARGO_TARGET_DIR=\"$HOME/.cache/domyjob/check-target\" CARGO_BUILD_JOBS=2 RUSTC_WRAPPER=; trap \"mise x -- cargo clean --quiet -p domyjob -p domyjob-core -p xtask\" EXIT; mise run clippy && mise run gates && mise run test'"

[tasks."check:win"]
description = "Lint and test this checkout on Windows through domyjob"
run = "cargo run --quiet --locked -p domyjob -- run win --wait -- powershell.exe -NoProfile -Command '$env:MISE_TRUSTED_CONFIG_PATHS=(Get-Location).Path; $env:CARGO_TARGET_DIR=Join-Path $env:LOCALAPPDATA \"domyjob/check-target\"; $env:CARGO_BUILD_JOBS=\"2\"; $env:RUSTC_WRAPPER=\"\"; mise run clippy; $code=$LASTEXITCODE; if ($code -eq 0) { mise run gates; $code=$LASTEXITCODE }; if ($code -eq 0) { mise x -- cargo xtask windows-contracts; $code=$LASTEXITCODE }; if ($code -eq 0) { mise run test; $code=$LASTEXITCODE }; mise x -- cargo clean --quiet -p domyjob -p domyjob-core -p xtask; exit $code'"

[tasks."check:fleet"]
description = "Run this checkout's checks on Linux and Windows"
run = ["mise run check:linux", "mise run check:win"]

[tasks."check:xtask:linux"]
description = "Lint and test repository tasks on Linux through domyjob"
run = "cargo run --quiet --locked -p domyjob -- run linux --wait -- /bin/bash -lc 'export MISE_TRUSTED_CONFIG_PATHS=\"$PWD\" CARGO_TARGET_DIR=\"$HOME/.cache/domyjob/check-target\" RUSTC_WRAPPER=; trap \"mise x -- cargo clean --quiet -p xtask\" EXIT; mise x -- cargo clippy --locked -p xtask --all-targets -- -D warnings && mise x -- cargo xtask gates && mise x -- cargo xtask workflows && mise x -- cargo test --locked -p xtask'"

[tasks."check:xtask:win"]
description = "Lint and test repository tasks on Windows through domyjob"
run = "cargo run --quiet --locked -p domyjob -- run win --wait -- powershell.exe -NoProfile -Command '$env:MISE_TRUSTED_CONFIG_PATHS=(Get-Location).Path; $env:CARGO_TARGET_DIR=Join-Path $env:LOCALAPPDATA \"domyjob/check-target\"; $env:RUSTC_WRAPPER=\"\"; mise x -- cargo clippy --locked -p xtask --all-targets -- -D warnings; $code=$LASTEXITCODE; if ($code -eq 0) { mise x -- cargo xtask gates; $code=$LASTEXITCODE }; if ($code -eq 0) { mise x -- cargo xtask workflows; $code=$LASTEXITCODE }; if ($code -eq 0) { mise x -- cargo test --locked -p xtask; $code=$LASTEXITCODE }; mise x -- cargo clean --quiet -p xtask; exit $code'"

[tasks."check:xtask:fleet"]
description = "Validate repository tasks on Linux and Windows without product tests"
run = ["mise run check:xtask:linux", "mise run check:xtask:win"]

[tasks."check:xtask:windows-contracts"]
description = "Check changed Windows SDK compiler contracts through domyjob"
run = "cargo run --quiet --locked -p domyjob -- run win --wait -- powershell.exe -NoProfile -Command '$env:MISE_TRUSTED_CONFIG_PATHS=(Get-Location).Path; $env:CARGO_TARGET_DIR=Join-Path $env:LOCALAPPDATA \"domyjob/check-target\"; $env:RUSTC_WRAPPER=\"\"; mise x -- cargo xtask windows-contracts; exit $LASTEXITCODE'"
