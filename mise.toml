[tools]
rust = { version = "1.98.0", components = ["clippy", "rustfmt"] }
actionlint = "1.7.12"
taplo = "0.10.0"
typos = "1.50.1"
lefthook = "2.1.9"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
"aqua:EmbarkStudios/cargo-deny" = "0.19.7"
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"
"cargo:cargo-vet" = "0.10.2"
"aqua:crate-ci/committed" = "1.1.11"
"npm:jscpd" = "5.3.2"
"aqua:axodotdev/cargo-dist" = "0.33.0"

[settings]
cargo.binstall = false

[tasks.bootstrap]
description = "Fetch the locked dependency graph and install the git hooks"
run = ["cargo fetch --locked", "lefthook install"]

[tasks.fmt]
description = "Format Rust and TOML"
run = ["cargo fmt --all", "taplo fmt"]
env = { RUST_LOG = "warn" }

[tasks."fmt:check"]
description = "Check Rust and TOML formatting without rewriting files"
run = ["cargo fmt --all -- --check", "taplo fmt --check", "taplo lint"]
env = { RUST_LOG = "warn" }

[tasks.clippy]
description = "Lint every target with warnings denied"
run = "cargo clippy --locked --workspace --all-targets --features failpoints -- -D warnings"

[tasks.gates]
description = "Enforce the rules Clippy cannot express: no comments, no #[allow], exact input, typed errors, no owned trait objects"
run = "cargo xtask gates"

[tasks.lint]
description = "Formatting, Clippy, the repository gates, spelling, workflows, and duplication"
depends = ["fmt:check", "clippy", "gates"]
run = ["typos", "cargo xtask workflows", "jscpd --config .jscpd.json --silent"]

[tasks.test]
description = "Run every test"
env = { CI_CANARY = "must-not-reach-a-job", CARGO_TARGET_DIR = "target/test" }
run = [
  "cargo nextest run --locked --workspace --all-targets --features failpoints",
  "cargo test --locked --workspace --doc",
]

[tasks.deny]
description = "Check licenses, bans, and sources"
run = "cargo xtask dependencies deny"

[tasks.audit]
description = "Check the dependency graph against the RustSec advisory database"
run = "cargo xtask dependencies audit"

[tasks.vet]
description = "Check pinned audit evidence and explicit exemptions for every dependency graph"
run = "cargo xtask dependencies vet"

[tasks.check]
description = "Run local lint, tests, license, advisory, and dependency audit checks"
run = ["mise run lint", "mise run test", "mise run deny", "mise run audit", "mise run vet"]

[tasks."check:fleet"]
description = "Lint and test the commit being pushed on every machine domyjob knows, the other operating systems included"
run = [
  "cargo run --quiet --package domyjob -- run ${DOMYJOB_CHECK_ON:-@all} @HEAD --wait --grep 'Summary|FAIL|TIMEOUT|test result|panicked|^error|^warning' -- 'mise run clippy && mise run test'",
]

[tasks.fuzz]
description = "Fuzz every input boundary for a fixed number of inputs"
dir = "fuzz"
run = [
  "cargo +nightly-2026-08-21 fetch --locked",
  "mkdir -p corpus/requests",
  "cp seeds/requests/*.json corpus/requests/",
  "cargo +nightly-2026-08-21 fuzz run requests -- -runs=200000 -seed=1 -verbosity=0 -print_final_stats=1",
  "cargo +nightly-2026-08-21 fuzz run orders -- -runs=200000 -seed=1 -verbosity=0 -print_final_stats=1",
  "cargo +nightly-2026-08-21 fuzz run releases -- -runs=200000 -seed=1 -verbosity=0 -print_final_stats=1",
  "cargo +nightly-2026-08-21 fuzz run terminal -- -runs=200000 -seed=1 -verbosity=0 -print_final_stats=1",
]

[tasks.kani]
description = "Prove the Kani harnesses"
dir = "crates/domyjob"
run = "cargo kani --lib --output-format terse"

[tasks.proverif]
description = "Prove the symbolic models and require every expected claim to hold (needs proverif on PATH)"
run = "cargo xtask proverif"

[tasks."mutations:authz"]
description = "Require tests to detect every viable mutation in authorization"
env = { TMPDIR = "/tmp", RUSTC_WRAPPER = "", CARGO_INCREMENTAL = "0" }
run = [
  "cargo fetch --locked",
  "rust-mutants run --no-config --cargo \"$(rustup which cargo)\" --file crates/domyjob/src/authz.rs --locked --offline --coverage --no-doctests --jobs 1 --timeout 5m --ui plain -- --test-threads=1",
]

[tasks."mutations:trust"]
description = "Require focused trust tests to detect every viable mutation in trust state"
env = { TMPDIR = "/tmp", RUSTC_WRAPPER = "", CARGO_INCREMENTAL = "0" }
run = [
  "cargo fetch --locked",
  "rust-mutants run --no-config --cargo \"$(rustup which cargo)\" --file crates/domyjob/src/trust.rs --locked --offline --coverage --no-doctests --jobs 1 --timeout 5m --ui plain -- trust --test-threads=1",
]
